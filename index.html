<!DOCTYPE html>
<html lang="hi">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

      color: #222;
    }

    header {
      background: #111827;
      color: white;

      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .logo span {
      color: #25d366;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 8px;
    }

      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;

    }

      font-size: 38px;

    }

    .hero p {

      margin-bottom: 25px;
    }

    .btn {

      background: #25d366;
      color: white;
      padding: 13px 22px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin: 5px;
    }

    .btn.call {
      background: #111827;
    }

    .section {
      padding: 40px 5%;
    }

    .section h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 28px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 25px 18px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card .icon {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
    }

    .product {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .product .phone {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .contact {
      background: #111827;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }
